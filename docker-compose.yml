# Local SQL Server for development and API e2e tests, used when the shared test server
# (DBLibSQLTest on 192.168.0.210) is not reachable. Restore a DBLibSQLTest backup into it.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD}
    ports:
      - '1433:1433'
    volumes:
      - mssql-data:/var/opt/mssql

volumes:
  mssql-data:
